name: Tests and client build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Keep the runner compatible with the pinned Playwright in requirements-browser.txt.
    # ubuntu-latest can move to an OS that this browser release does not support.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LLM_BACKEND: api
      LLM_API_KEY: ""
      GEOAPIFY_API_KEY: ""
      KROGER_CLIENT_ID: ""
      KROGER_CLIENT_SECRET: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: python -m pip install -r requirements.txt
      - name: Offline Python contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Graph and workflow regression tests
        run: jac test
      - name: Account isolation over HTTP
        run: python scripts/verify_accounts.py
      - name: Client build
        run: jac build main.jac
      - name: Mobile browser dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: PWA installation, offline privacy and mobile account flow
        run: python scripts/verify_mobile.py

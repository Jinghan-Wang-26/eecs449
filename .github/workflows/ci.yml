name: Tests and client build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_BACKEND: api
      LLM_API_KEY: ""
      GEOAPIFY_API_KEY: ""
      KROGER_CLIENT_ID: ""
      KROGER_CLIENT_SECRET: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: python -m pip install -r requirements.txt
      - name: Offline Python contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Graph and workflow regression tests
        run: jac test
      - name: Client build
        run: jac build main.jac

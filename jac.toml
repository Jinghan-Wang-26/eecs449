[project]
name = "cartcompass"
version = "0.1.0"
description = "CartCompass: a personalized shopping agent for everyday errands"
entry-point = "main.jac"
kind = "fullstack"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[test]
directory = "tests"

[serve]
base_route_app = "app"

[plugins.client]

# Public manifest and icons; the custom worker never caches private API data.
[plugins.client.app_meta_data]
title = "CartCompass | Your shopping assistant"
description = "Plan your shopping around nearby stores, your budget and your schedule."
viewport = "width=device-width,initial-scale=1,viewport-fit=cover"
theme_color = "#1d5a3f"
manifest = "/static/mobile/app.webmanifest"
icon = "/static/mobile/icon.svg"
apple_touch_icon = "/static/mobile/apple-touch-icon.png"
meta_apple_mobile_web_app_title = "CartCompass"

<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>

  <meta name="google" content="notranslate">

  <meta name="theme-color" content="#1d5a3f">
  <title>Offline · CartCompass</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #eef2ed; color: #17251d; font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 440px; padding: 32px; border: 1px solid #e1e7df; border-radius: 24px; background: white; }
    img { border-radius: 16px; } h1 { font-size: 28px; line-height: 1.2; } p { color: #627068; }
    a { display: inline-block; padding: 12px 18px; background: #1d5a3f; color: white; border-radius: 12px; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #2f7a55; outline-offset: 4px; } small { display: block; margin-top: 24px; color: #627068; }

</head>
<body><main>
  <img src="/static/mobile/icon-192.png" width="64" height="64" alt="CartCompass">
  <h1>You are offline</h1>
  <p>Reconnect to open your shopping workspace. Prices, store availability and transit information need a fresh connection.</p>
  <a href="/">Try again</a>
